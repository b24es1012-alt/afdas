version: "3.9"

services:
  # ─── AFDAS Backend API ───────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: afdas-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - afdas-network

  # ─── PostgreSQL + PostGIS ────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    container_name: afdas-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: afdas
      POSTGRES_USER: afdas_user
      POSTGRES_PASSWORD: afdas_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afdas_user -d afdas"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - afdas-network

  # ─── Redis Cache ────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: afdas-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - afdas-network

volumes:
  postgres_data:
  redis_data:

networks:
  afdas-network:
    driver: bridge
